<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Kill Team 規則速查</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#111315">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="KT 速查">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="app">
  <div class="top">
    <div class="brand">
      <div class="bar"></div>
      <div><h1>Kill Team 規則速查</h1><small>離線 PWA</small></div>
    </div>
    <div style="display:flex;gap:8px;align-items:center">
      <button id="installBtn" class="install-btn" style="display:none">安裝到手機</button>
      <select id="teamSelect" class="team team-select" aria-label="選擇隊伍">
        <option value="pm">瘟疫戰士</option>
        <option value="aod">死亡天使</option>
            <option value="wk">破壞專隊</option>
        <option value="mw">屠戮之翼</option>
        <option value="leg">軍團</option>
        <option value="dw">死亡守望</option>
        <option value="ci">潔天使隱伏者</option>
        <option value="cc">冥工之環</option>
        <option value="ks">卡舍津</option>
      </select>
    </div>
  </div>
  <div id="installNote" class="install-note"></div>

  <div class="sticky">
    <div class="search">
      <span class="icon">⌕</span>
      <input id="q" placeholder="搜尋規則、武器或特工：震盪、掩護、鬥士…">
    </div>
  </div>

  <div class="tabs" id="tabs"></div>
  <div id="content"><div class="empty">載入規則資料中…</div></div>
</div>

<div class="bottom"><div class="navs">
  <button class="nav on" data-view="all"><b>查規則</b><span>搜尋全部</span></button>
  <button class="nav" data-view="team"><b>隊伍</b><span id="navTeamName">瘟疫戰士</span></button>
  <button class="nav" data-view="flow"><b>流程</b><span>桌邊提示</span></button>
  <button class="nav" data-view="fav"><b>收藏</b><span>常用規則</span></button>
</div></div>

<script src="data/core_rules.js"></script>
<script src="data/weapon_rules.js"></script>
<script src="data/plague_marines.js"></script>
<script src="data/angels_of_death.js"></script>
  <script src="data/wrecka_krew.js"></script>
<script src="data/murderwing.js"></script>
<script src="data/legionary.js"></script>
<script src="data/deathwatch.js"></script>
<script src="data/celestian_insidiants.js"></script>
<script src="data/canoptek_circle.js"></script>
<script src="data/kasrkin.js"></script>
<script src="data/universal_equipment.js"></script>
<script src="data/tac_ops.js"></script>
<script src="data/mission_ops.js"></script>
<script src="data/approved_ops.js"></script>
<script src="app.js" defer></script>
</body>
</html>
